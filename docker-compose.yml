version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: reciclaje_db
    environment:
      POSTGRES_USER: reciclaje_user
      POSTGRES_PASSWORD: reciclaje_password
      POSTGRES_DB: reciclaje_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - reciclaje_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: reciclaje_backend
    environment:
      DATABASE_URL: postgresql://reciclaje_user:reciclaje_password@db:5432/reciclaje_db
    ports:
      - "5000:5000"
    depends_on:
      - db
    networks:
      - reciclaje_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    container_name: reciclaje_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - reciclaje_network

networks:
  reciclaje_network:
    driver: bridge

volumes:
  postgres_data:
